name: Convert Repo Structure to JSON and Push to Release Branch

on:
  #  push:
  #    branches: [ main ]
  pull_request_target:
    types: [ opened, synchronize, closed ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-push-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout correct branch
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Generate JSON from repository structure
        run: python generate_json.py

      - name: Commit and push to release branch (if applicable)
        if: |
          github.event_name != 'pull_request_target' || 
          github.event.pull_request.merged == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout -B release

          git add .

          git diff --cached --quiet || git commit -m "Generate JSON files and push to release branch"

          git push -f https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:release

  delete-pr-branch-if-merged:
    runs-on: ubuntu-latest
    needs: generate-and-push-json
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    steps:
      - name: Delete merged PR branch
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}
          echo "✅ Deleted branch: ${{ github.event.pull_request.head.ref }}"

  close-pr-on-failure:
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'pull_request_target'
    needs: generate-and-push-json
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Close the Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr close "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --comment "❌ 自动关闭：生成 JSON 失败。请检查提交内容是否符合要求。"

      - name: Delete PR branch after failure (if not main/release and from same repo)
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          PR_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          CUR_REPO="${{ github.repository }}"

          if [ "$PR_REPO" = "$CUR_REPO" ]; then
            if [ "$BRANCH_NAME" != "main" ] && [ "$BRANCH_NAME" != "release" ]; then
              gh api -X DELETE repos/$CUR_REPO/git/refs/heads/$BRANCH_NAME
              echo "🗑️ 已删除失败 PR 分支：$BRANCH_NAME"
            else
              echo "⚠️ 跳过删除 protected 分支：$BRANCH_NAME"
            fi
          else
            echo "🔒 跳过删除 fork PR 的分支：$BRANCH_NAME"
          fi
